<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b21"/>
      <stop offset="100%" stop-color="#0c0f14"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd17a"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(245, 166, 35, 0.25)"/>
      <stop offset="100%" stop-color="rgba(245, 166, 35, 0)"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="480" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="480" rx="14" fill="url(#glow)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="48" fill="#10131a"/>
  <rect x="0" y="46" width="800" height="2" fill="url(#accentBar)"/>
  <circle cx="20" cy="24" r="6" fill="#f5a623"/>
  <circle cx="40" cy="24" r="6" fill="#1c1f25" stroke="#f5a623" stroke-width="1.5"/>
  <circle cx="60" cy="24" r="6" fill="#1c1f25" stroke="#444" stroke-width="1"/>
  <text x="84" y="29" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f5a623">PATCHCRAFT</text>
  <text x="184" y="29" font-family="system-ui, sans-serif" font-size="11" fill="#8b9098" letter-spacing="2">INSTRUMENT BUILDER</text>

  <!-- Sidebar -->
  <rect x="0" y="48" width="180" height="432" fill="#10131a"/>
  <text x="20" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8b9098" letter-spacing="2">ELEMENTS</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#c7cdd6">
    <rect x="14" y="98" width="156" height="28" rx="4" fill="rgba(245, 166, 35, 0.10)"/>
    <text x="26" y="116">Knob</text>
    <text x="26" y="146">Slider</text>
    <text x="26" y="176">Drum Pad</text>
    <text x="26" y="206">XY Pad</text>
    <text x="26" y="236">Keyboard</text>
    <text x="26" y="266">Label</text>
    <text x="26" y="296">Tab Panel</text>
  </g>

  <!-- Canvas -->
  <rect x="200" y="68" width="420" height="392" rx="6" fill="#0e1116" stroke="#2a2e35" stroke-width="1"/>
  <rect x="216" y="84" width="388" height="60" rx="4" fill="#15171b"/>
  <text x="232" y="118" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f5f3f7">Cinematic Evolve Pad</text>
  <text x="232" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#8b9098" letter-spacing="2">TRANCE • ELECTRONIC</text>

  <!-- Knob row -->
  <g transform="translate(216, 200)">
    <g>
      <circle cx="32" cy="32" r="28" fill="#1c1f25" stroke="#f5a623" stroke-width="1.5"/>
      <line x1="32" y1="10" x2="32" y2="22" stroke="#f5a623" stroke-width="2"/>
      <text x="32" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#c7cdd6" text-anchor="middle">CUTOFF</text>
    </g>
    <g transform="translate(80, 0)">
      <circle cx="32" cy="32" r="28" fill="#1c1f25" stroke="#f5a623" stroke-width="1.5"/>
      <line x1="32" y1="32" x2="48" y2="20" stroke="#f5a623" stroke-width="2"/>
      <text x="32" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#c7cdd6" text-anchor="middle">RES</text>
    </g>
    <g transform="translate(160, 0)">
      <circle cx="32" cy="32" r="28" fill="#1c1f25" stroke="#f5a623" stroke-width="1.5"/>
      <line x1="32" y1="32" x2="20" y2="50" stroke="#f5a623" stroke-width="2"/>
      <text x="32" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#c7cdd6" text-anchor="middle">DRIVE</text>
    </g>
    <g transform="translate(240, 0)">
      <circle cx="32" cy="32" r="28" fill="#1c1f25" stroke="#f5a623" stroke-width="1.5"/>
      <line x1="32" y1="10" x2="20" y2="22" stroke="#f5a623" stroke-width="2"/>
      <text x="32" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#c7cdd6" text-anchor="middle">REVERB</text>
    </g>
    <g transform="translate(320, 0)">
      <circle cx="32" cy="32" r="28" fill="#1c1f25" stroke="#f5a623" stroke-width="1.5"/>
      <line x1="32" y1="32" x2="48" y2="44" stroke="#f5a623" stroke-width="2"/>
      <text x="32" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#c7cdd6" text-anchor="middle">DELAY</text>
    </g>
  </g>

  <!-- Pad grid -->
  <g transform="translate(216, 304)">
    <rect x="0" y="0" width="180" height="120" rx="4" fill="#0a0c10" stroke="#2a2e35"/>
    <g fill="#1c1f25" stroke="#f5a623" stroke-width="1">
      <rect x="6"   y="6"   width="40" height="26" rx="3"/>
      <rect x="48"  y="6"   width="40" height="26" rx="3" fill="#f5a623" stroke="none"/>
      <rect x="90"  y="6"   width="40" height="26" rx="3"/>
      <rect x="132" y="6"   width="40" height="26" rx="3"/>
      <rect x="6"   y="34"  width="40" height="26" rx="3"/>
      <rect x="48"  y="34"  width="40" height="26" rx="3"/>
      <rect x="90"  y="34"  width="40" height="26" rx="3"/>
      <rect x="132" y="34"  width="40" height="26" rx="3"/>
      <rect x="6"   y="62"  width="40" height="26" rx="3"/>
      <rect x="48"  y="62"  width="40" height="26" rx="3"/>
      <rect x="90"  y="62"  width="40" height="26" rx="3" fill="rgba(245,166,35,0.5)"/>
      <rect x="132" y="62"  width="40" height="26" rx="3"/>
      <rect x="6"   y="90"  width="40" height="26" rx="3"/>
      <rect x="48"  y="90"  width="40" height="26" rx="3"/>
      <rect x="90"  y="90"  width="40" height="26" rx="3"/>
      <rect x="132" y="90"  width="40" height="26" rx="3"/>
    </g>
  </g>

  <!-- Inspector / Layers -->
  <rect x="640" y="68" width="160" height="392" rx="6" fill="#10131a" stroke="#2a2e35"/>
  <text x="660" y="92" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f5a623" letter-spacing="2">INSPECTOR</text>
  <g font-family="system-ui, sans-serif" font-size="11" fill="#c7cdd6">
    <rect x="654" y="106" width="132" height="22" rx="3" fill="#1c1f25"/>
    <text x="660" y="121">Knob: cutoff</text>

    <text x="660" y="148" fill="#8b9098" font-size="9">PARAMETER</text>
    <rect x="654" y="152" width="132" height="22" rx="3" fill="#1c1f25"/>
    <text x="660" y="167">filterCutoff</text>

    <text x="660" y="194" fill="#8b9098" font-size="9">STYLE</text>
    <rect x="654" y="198" width="132" height="22" rx="3" fill="#1c1f25"/>
    <text x="660" y="213">Vintage Gold</text>

    <text x="660" y="240" fill="#8b9098" font-size="9">SIZE</text>
    <rect x="654" y="244" width="132" height="22" rx="3" fill="#1c1f25"/>
    <text x="660" y="259">90 × 100</text>

    <text x="660" y="286" fill="#8b9098" font-size="9">ACCENT COLOUR</text>
    <rect x="654" y="290" width="132" height="22" rx="3" fill="#f5a623"/>
  </g>
</svg>
